name: Test IS Beauty
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        run: npm test

      - name: Audit production dependencies
        working-directory: backend
        run: npm audit --omit=dev

  browser:
    name: Browser smoke (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Setup Chrome on CI runner only
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Allow Chrome sandbox on Ubuntu runner
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          # Ubuntu restricts user namespaces for Chrome for Testing outside /opt/google/chrome.
          # Scope the exception to this executable on this ephemeral runner; keep Chrome sandbox enabled.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            cat <<EOF | sudo tee /etc/apparmor.d/isbeauty-ci-chrome > /dev/null
          abi <abi/4.0>,
          include <tunables/global>
          profile isbeauty-ci-chrome "$CHROME_PATH" flags=(unconfined) {
            userns,
          }
          EOF
            sudo apparmor_parser -r /etc/apparmor.d/isbeauty-ci-chrome
          fi
      - name: Browser smoke with isolated fixtures
        working-directory: backend
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/browser-smoke.mjs
