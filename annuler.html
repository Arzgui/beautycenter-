<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Annuler mon rendez-vous — IS Beauty</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=Outfit:wght@300;400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/laser-premium-v2.css">
  <style>
    .cancel-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .cancel-topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 2rem;
      background: rgba(7, 11, 20, 0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(26, 236, 255, 0.08);
    }
    .cancel-topbar a {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--color-muted);
      transition: var(--transition-fast);
      text-decoration: none;
    }
    .cancel-topbar a:hover { color: var(--color-cyan); }
    .cancel-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 24px 60px;
      position: relative;
      overflow: hidden;
    }
    .cancel-main::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 15% 40%, rgba(26, 236, 255, 0.07) 0%, transparent 45%),
        radial-gradient(ellipse at 85% 60%, rgba(201, 174, 255, 0.05) 0%, transparent 40%);
      pointer-events: none;
    }
    .cancel-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(26, 236, 255, 0.1);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      text-align: center;
    }
    .cancel-icon {
      font-size: 2.5rem;
      margin-bottom: 1.25rem;
    }
    .cancel-icon.loading { color: var(--color-cyan); }
    .cancel-icon.success { color: #6FE3A0; }
    .cancel-icon.error { color: #FF8B8B; }
    .cancel-title {
      font-family: var(--font-heading, 'Outfit', sans-serif);
      font-size: 1.4rem;
      color: #fff;
      margin-bottom: 0.75rem;
    }
    .cancel-text {
      color: var(--color-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .cancel-btn {
      display: inline-block;
      padding: 12px 28px;
      background: var(--color-cyan);
      color: #070B14;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      transition: var(--transition-fast);
    }
    .cancel-btn:hover { opacity: 0.85; }
    .cancel-btn.secondary {
      background: none;
      border: 1px solid rgba(26, 236, 255, 0.25);
      color: var(--color-cyan);
    }
    .cancel-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .spin {
      animation: cancel-spin 1s linear infinite;
    }
    @keyframes cancel-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="cancel-page">

  <div class="cancel-topbar">
    <a href="/">
      <i class="fa-solid fa-arrow-left"></i>
      Retour au site
    </a>
  </div>

  <main class="cancel-main">
    <div class="cancel-card" id="cancelCard">
      <div class="cancel-icon loading">
        <i class="fa-solid fa-circle-notch spin"></i>
      </div>
      <h1 class="cancel-title">Annulation en cours…</h1>
      <p class="cancel-text">Merci de patienter un instant.</p>
    </div>
  </main>

  <script src="js/cancel-booking.js" defer></script>

</body>
</html>
